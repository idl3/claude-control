<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Control — Tabs</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex; align-items: center;
    font: 400 13px/1.3 -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: #e7e9ee;
    background: rgba(16, 21, 31, 0.94);
    -webkit-user-select: none; user-select: none;
  }
  .drag { width: 82px; height: 100%; flex: 0 0 auto; }
  .brand {
    flex: 0 0 auto; padding: 0 10px 0 0; font-weight: 600; letter-spacing: -0.01em;
    color: #9fb4e0; opacity: 0.8; display: flex; align-items: center; gap: 6px;
  }
  .brand svg { width: 14px; height: 14px; fill: currentColor; }
  .tabs { display: flex; align-items: center; flex: 1 1 auto; height: 100%; gap: 4px; overflow: hidden; padding: 0 6px; }
  .tab {
    display: flex; align-items: center; gap: 6px; max-width: 180px; min-width: 80px;
    height: 28px; padding: 0 8px; border-radius: 6px; cursor: default;
    background: rgba(255,255,255,0.05); border: 1px solid transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab:hover { background: rgba(255,255,255,0.1); }
  .tab.active { background: rgba(60, 100, 200, 0.25); border-color: rgba(90, 130, 220, 0.5); }
  .tab span { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .tab .close {
    flex: 0 0 auto; width: 14px; height: 14px; border-radius: 3px; border: 0;
    background: transparent; color: #8b93a3; font-size: 13px; line-height: 14px;
    padding: 0; cursor: default; display: flex; align-items: center; justify-content: center;
  }
  .tab .close:hover { background: rgba(255,100,100,0.25); color: #fff; }
  .toolbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 4px;
    padding: 0 10px 0 6px; height: 100%;
  }
  .btn {
    height: 24px; padding: 0 8px; border-radius: 5px; border: 0;
    background: rgba(255,255,255,0.06); color: #c2c8d3;
    font: 400 12px/1 -apple-system, system-ui, sans-serif; cursor: default;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .btn.add { padding: 0 7px; font-weight: 600; }
  [data-tauri-drag-region] { -webkit-app-region: drag; app-region: drag; }
</style>
</head>
<body>
<div class="drag" data-tauri-drag-region></div>
<div class="brand">
  <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/></svg>
  Claude Control
</div>
<div class="tabs" id="tabs"></div>
<div class="toolbar">
  <button class="btn add" id="new-tab" title="New tab">+</button>
  <button class="btn" id="reload" title="Reload app">↻</button>
  <button class="btn" id="processes" title="Processes">⚙</button>
  <button class="btn" id="settings" title="Settings">⋯</button>
</div>
<script>
  const $ = (sel) => document.querySelector(sel);
  const tabsEl = $('#tabs');

  function invoke(cmd, args) {
    const tauri = window.__TAURI__;
    if (!tauri || !tauri.core || !tauri.core.invoke) {
      console.warn('[tabs] Tauri global not ready for', cmd);
      return Promise.reject('no tauri');
    }
    return tauri.core.invoke(cmd, args || {});
  }

  function render(tabs, activeId) {
    tabsEl.innerHTML = '';
    for (const tab of tabs) {
      const el = document.createElement('div');
      el.className = 'tab' + (tab.id === activeId ? ' active' : '');
      el.title = tab.url;
      const title = document.createElement('span');
      title.textContent = tab.title || tab.url;
      const close = document.createElement('button');
      close.className = 'close';
      close.textContent = '×';
      close.title = 'Close tab';
      close.addEventListener('click', (e) => {
        e.stopPropagation();
        invoke('close_browser_tab', { id: tab.id }).catch(console.error);
      });
      el.appendChild(title);
      el.appendChild(close);
      el.addEventListener('click', () => {
        invoke('activate_browser_tab', { id: tab.id }).catch(console.error);
      });
      tabsEl.appendChild(el);
    }
  }

  window.updateTabs = (tabs, activeId) => {
    render(Array.isArray(tabs) ? tabs : [], activeId);
  };

  $('#new-tab').addEventListener('click', () => {
    const url = window.prompt('Open URL in a new tab:');
    if (!url) return;
    invoke('open_browser_tab', { url: url.trim() }).catch(console.error);
  });

  $('#reload').addEventListener('click', () => invoke('shell_action', { action: 'reload' }).catch(console.error));
  $('#settings').addEventListener('click', () => invoke('shell_action', { action: 'settings' }).catch(console.error));
  $('#processes').addEventListener('click', () => invoke('shell_action', { action: 'processes' }).catch(console.error));

  // Safety: Tauri global may already be present; if not, poll briefly.
  if (!window.__TAURI__) {
    let n = 0;
    const iv = setInterval(() => {
      if (window.__TAURI__ || ++n > 50) clearInterval(iv);
    }, 50);
  }
</script>
</body>
</html>
